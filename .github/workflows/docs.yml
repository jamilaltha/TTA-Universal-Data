name: Docs

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz -o mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/

      - name: Build mdBook
        working-directory: docs/book
        run: mdbook build

      - name: Install LaTeX (minimal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended

      - name: Build whitepaper PDF
        working-directory: docs
        run: pdflatex whitepaper.tex
