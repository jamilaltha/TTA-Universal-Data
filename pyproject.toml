[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d10z"
version = "0.1.0"
description = "D10Z-TTA: The Mechanics of Infinity - A unified framework for reconciling physical theories"
readme = "README.md"
license = {text = "CHLL-D10Z v1.1"}
requires-python = ">=3.8"
authors = [
    {name = "Jamil Al Thani", email = "jamil@d10z.org"}
]
maintainers = [
    {name = "Jamil Al Thani", email = "jamil@d10z.org"}
]
keywords = [
    "physics",
    "cosmology",
    "unified-theory",
    "quantum-mechanics",
    "general-relativity",
    "dark-matter",
    "galaxy-rotation",
    "hubble-tension",
    "TTA",
    "D10Z",
    "GM-scale",
    "point-zero",
    "reconciliation",
    "fractal-cosmology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
full = [
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.scripts]
d10z = "d10z.cli:main"

[project.urls]
Homepage = "https://d10z.org"
Documentation = "https://d10z.readthedocs.io"
Repository = "https://github.com/jamilaltha/d10z"
Issues = "https://github.com/jamilaltha/d10z/issues"
Changelog = "https://github.com/jamilaltha/d10z/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["d10z*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=__init__.py"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["d10z"]
branch = true
omit = [
    "tests/*",
    "d10z/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
